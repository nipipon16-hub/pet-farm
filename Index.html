<!DOCTYPE html>
<html lang="th">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2B7DF0">
<title>ฟาร์มสัตว์เลี้ยงประจำห้อง</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;700&family=Sarabun:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F1FF;--surface:#FFFFFF;--soft:#ECE7FF;--ink:#2B2147;--muted:#6B6490;--line:#DDD6F7;
  --primary:#5B3FD0;--on-primary:#FFFFFF;--mint:#7FD8BE;--sun:#FFC857;--coral:#FF7F7F;
  --ok:#17785A;--warn:#B4402A;--shadow:0 6px 0 rgba(91,63,208,.12);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#16112B;--surface:#221B3F;--soft:#2E2552;--ink:#F1EEFF;--muted:#A9A2D0;--line:#3A3163;
    --primary:#A592FF;--on-primary:#16112B;--ok:#6FE0B8;--warn:#FF9D88;--shadow:0 6px 0 rgba(0,0,0,.25);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#16112B;--surface:#221B3F;--soft:#2E2552;--ink:#F1EEFF;--muted:#A9A2D0;--line:#3A3163;
  --primary:#A592FF;--on-primary:#16112B;--ok:#6FE0B8;--warn:#FF9D88;--shadow:0 6px 0 rgba(0,0,0,.25);
  color-scheme:dark;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Sarabun','Noto Sans Thai',system-ui,sans-serif;font-size:16px;line-height:1.55}
h1,h2,h3,.disp{font-family:'Mali','Sarabun','Noto Sans Thai',system-ui,sans-serif;margin:0;line-height:1.25}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:16px}
header.top{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between;margin-bottom:16px}
header.top h1{font-size:24px}
header.top p{margin:2px 0 0;color:var(--muted);font-size:14px}
.ctrls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.seg{display:inline-flex;background:var(--soft);border-radius:999px;padding:4px}
.seg button{border:0;background:transparent;padding:8px 18px;border-radius:999px;font-weight:700;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
select,input[type=text],input[type=number]{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:8px 12px;min-height:40px}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}
.panel + .panel{margin-top:14px}
.panel h2{font-size:18px;margin-bottom:10px}
.student{display:grid;gap:16px;grid-template-columns:minmax(0,1fr)}
@media (min-width:880px){.student{grid-template-columns:minmax(0,430px) minmax(0,1fr);align-items:start}}
.scene{border-radius:28px;overflow:hidden;border:3px solid var(--ink);background:var(--surface);position:relative}
.scene svg{display:block;width:100%;height:auto;aspect-ratio:1/1}
.scene .cap{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:12px 14px;background:var(--surface);border-top:3px solid var(--ink)}
.scene .cap input{border:2px dashed var(--line);background:transparent;font-family:'Mali',sans-serif;font-weight:700;font-size:18px;width:100%;min-width:0}
.stagepill{white-space:nowrap;background:var(--sun);color:#2B2147;border-radius:999px;padding:4px 12px;font-weight:700;font-size:14px}
.grown{position:absolute;left:12px;right:12px;top:12px;background:var(--sun);color:#2B2147;border:3px solid #2B2147;border-radius:16px;padding:8px 12px;font-family:'Mali',sans-serif;font-weight:700;text-align:center}
.hatchbtn{position:absolute;left:50%;bottom:78px;transform:translateX(-50%)}
.btn{border:2px solid var(--ink);background:var(--surface);border-radius:12px;padding:8px 14px;font-weight:700;min-height:40px}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.sun{background:var(--sun);color:#2B2147;border-color:#2B2147}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.small{padding:4px 10px;min-height:32px;font-size:14px}
.bigscore{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.bigscore b{font-family:'Mali',sans-serif;font-size:44px;line-height:1}
.bigscore span{color:var(--muted)}
.bar{position:relative;height:16px;background:var(--soft);border-radius:999px;margin:18px 6px 24px}
.bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--mint),var(--sun));border-radius:999px;transition:width .6s ease}
.bar em{position:absolute;top:-3px;width:4px;height:22px;background:var(--ink);border-radius:2px;opacity:.5}
.bar small{position:absolute;top:24px;transform:translateX(-50%);font-size:11px;color:var(--muted);white-space:nowrap}
.hint{color:var(--muted);font-size:14px;margin:0}
.wallet{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.wallet b{font-family:'Mali',sans-serif;font-size:30px}
.tabs button{border:2px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 16px;font-weight:700;white-space:nowrap;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--coral);color:#2B2147;font-size:12px;margin-left:6px}
.species{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.species button{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:6px 12px;font-weight:700}
.species button[aria-pressed="true"]{border-color:var(--primary);background:var(--soft)}
.grp{margin:14px 0 6px;font-weight:700;color:var(--muted);font-size:14px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.item{border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center;background:var(--surface)}
.item.on{border-color:var(--primary);background:var(--soft)}
.item .em{font-size:30px;line-height:1.2}
.item .nm{font-weight:700;font-size:14px}
.item .pr{font-size:13px;color:var(--muted);margin-bottom:6px}
.list{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.list li{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:2px solid var(--line);border-radius:14px;padding:10px 12px}
.st-pending{color:var(--muted)}.st-approved{color:var(--ok);font-weight:700}.st-rejected{color:var(--warn);font-weight:700}
.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.row:last-child{border-bottom:0}
.mini{height:8px;background:var(--soft);border-radius:99px;overflow:hidden;margin-top:4px}
.mini i{display:block;height:100%;background:var(--mint)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{padding:8px 10px;text-align:center;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;position:sticky;left:0;background:var(--surface);font-weight:700}
th{font-size:14px;vertical-align:bottom;background:var(--soft)}
th:first-child{background:var(--soft)}
th label{display:block;font-weight:400;font-size:12px;color:var(--muted)}
td input{width:64px;text-align:center;padding:6px 4px}
th input{width:56px;text-align:center;padding:2px 4px;min-height:28px;border-radius:8px}
td.tot{font-family:'Mali',sans-serif;font-weight:700}
.sumok{color:var(--ok);font-weight:700}.sumbad{color:var(--warn);font-weight:700}
form.award{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));align-items:end}
form.award label{display:grid;gap:4px;font-weight:700;font-size:14px}
.quick{display:flex;gap:6px;flex-wrap:wrap}
footer{margin-top:20px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;color:var(--muted);font-size:13px}
#overlay{position:fixed;inset:0;background:rgba(22,17,43,.72);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);z-index:60;display:grid;place-items:center;padding:16px;overflow-y:auto;animation:fadein .18s ease-out}
#overlay[hidden]{display:none}
.ov-card{position:relative;background:var(--surface);color:var(--ink);border:3px solid var(--ink);border-radius:28px;padding:26px 20px 20px;max-width:380px;width:100%;text-align:center;margin-top:44px;box-shadow:0 10px 0 rgba(0,0,0,.25);animation:popin .3s cubic-bezier(.34,1.56,.64,1)}
.ov-card .ov-title{font-family:'Mali',sans-serif;font-weight:700;font-size:20px;margin:0 0 6px}
.egg-btn{border:0;background:transparent;width:220px;max-width:70%;padding:0;margin:6px auto}
.egg-btn svg,.ov-card svg.pet{width:100%;height:auto;display:block}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:90}
.confetti i{position:absolute;top:-16px;width:9px;height:14px;border-radius:2px;animation:fall 2s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(600deg)}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-4deg)}75%{transform:rotate(4deg)}}
@keyframes tw{0%,100%{opacity:.2;transform:scale(.5)}50%{opacity:1;transform:scale(1.1)}}
.bob{animation:bob 2.6s ease-in-out infinite}
.wob{transform-box:fill-box;transform-origin:50% 100%;animation:wob 1.8s ease-in-out infinite}
.wob.fast{animation-duration:.5s}
.tw{transform-box:fill-box;transform-origin:center;animation:tw 1.8s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.galwrap{overflow-x:auto}
.gallery{display:grid;grid-template-columns:72px repeat(5,minmax(110px,1fr));gap:8px;min-width:700px;align-items:center}
.gh{text-align:center;font-size:13px;color:var(--muted);line-height:1.3}
.gh b{color:var(--ink);font-family:'Mali',sans-serif}
.gn{text-align:center;font-weight:700;font-size:14px;line-height:1.3}
.gc{background:#EFEAFF;border-radius:16px;padding:4px}
.gc svg{display:block;width:100%;height:auto}

.chip{background:var(--soft);border-radius:999px;padding:4px 12px;font-size:13px;max-width:60vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.login{max-width:440px;margin:40px auto;text-align:center}

.petmove{transform-box:view-box}
.jump{animation:jump .7s ease-out}
@keyframes jump{0%{transform:translateY(0)}35%{transform:translateY(-26px)}60%{transform:translateY(0)}75%{transform:translateY(-8px)}100%{transform:translateY(0)}}
.scene svg[data-act]{cursor:pointer;-webkit-tap-highlight-color:transparent}
.heart{position:absolute;font-size:22px;pointer-events:none;animation:floatup 1.3s ease-out forwards}
@keyframes floatup{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateY(-90px) scale(1.2);opacity:0}}
.bubble{position:absolute;left:50%;top:10%;background:var(--surface);color:var(--ink);border:3px solid var(--ink);border-radius:16px;padding:4px 14px;font-family:'Mali',sans-serif;font-weight:700;pointer-events:none;white-space:nowrap;transform:translateX(-50%);animation:pop 1.8s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:translateX(-50%) scale(.6)}12%{opacity:1;transform:translateX(-50%) scale(1.05)}20%{transform:translateX(-50%) scale(1)}80%{opacity:1}100%{opacity:0}}
.nameinput{width:100%;margin:6px 0 12px;text-align:center;font-family:'Mali',sans-serif;font-weight:700;font-size:18px}

/* ---------- แจ้งเตือน (toast) ---------- */
#toasts{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;flex-direction:column;gap:10px;z-index:90;width:min(92vw,430px);pointer-events:none}
.toast{pointer-events:auto;position:relative;overflow:hidden;display:flex;align-items:center;gap:12px;background:var(--surface);color:var(--ink);border:3px solid var(--ink);border-radius:20px;padding:10px 8px 14px 10px;box-shadow:0 6px 0 rgba(0,0,0,.22);animation:toastin .38s cubic-bezier(.34,1.56,.64,1)}
.toast.out{animation:toastout .26s ease-in forwards}
.ticon{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px;border:2px solid var(--ink);color:#2B2147}
.t-success .ticon{background:var(--mint)}.t-error .ticon{background:var(--coral)}.t-warn .ticon{background:var(--sun)}.t-info .ticon{background:#CFC6FF}
.tmsg{flex:1;font-weight:700;line-height:1.35;word-break:break-word}
.tx{flex:none;border:0;background:transparent;font-size:24px;line-height:1;color:var(--muted);padding:2px 8px;border-radius:10px}
.tx:hover{background:var(--soft)}
.tbar{position:absolute;left:0;bottom:0;height:6px;width:100%;transform-origin:left center;animation:tbar linear forwards}
.t-success .tbar{background:var(--mint)}.t-error .tbar{background:var(--coral)}.t-warn .tbar{background:var(--sun)}.t-info .tbar{background:var(--primary)}
@keyframes toastin{from{opacity:0;transform:translateY(26px) scale(.9)}to{opacity:1;transform:none}}
@keyframes toastout{to{opacity:0;transform:translateY(14px) scale(.95)}}
@keyframes tbar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
/* ---------- หน้าต่างยืนยัน (dialog) ---------- */
#dialog{position:fixed;inset:0;z-index:80}
#dialog[hidden]{display:none}
.backdrop{position:absolute;inset:0;background:rgba(22,17,43,.62);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:grid;place-items:center;padding:16px;overflow-y:auto;animation:fadein .18s ease-out}
.modal{position:relative;background:var(--surface);color:var(--ink);border:3px solid var(--ink);border-radius:28px;max-width:400px;width:100%;margin-top:40px;padding:26px 20px 20px;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.25);animation:popin .3s cubic-bezier(.34,1.56,.64,1)}
.micon{width:78px;height:78px;margin:-66px auto 12px;border-radius:50%;display:grid;place-items:center;font-size:38px;border:3px solid var(--ink);background:var(--sun);color:#2B2147;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.tone-danger .micon{background:var(--coral);animation:wiggle .6s ease-in-out .25s}
.tone-success .micon{background:var(--mint)}
.tone-info .micon{background:#CFC6FF}
.modal h3{font-size:21px;margin-bottom:6px}
.mmsg{margin:6px 0 4px;color:var(--muted);line-height:1.5}
.mrows{margin:12px 0 2px;padding:10px 14px;background:var(--soft);border-radius:16px;display:grid;gap:6px;text-align:left}
.mrows div{display:flex;justify-content:space-between;gap:14px;align-items:baseline}
.mrows dt{color:var(--muted);font-size:14px}
.mrows dd{margin:0;font-weight:700;text-align:right;word-break:break-word}
.mbtns{display:flex;gap:10px;margin-top:18px}
.mbtns .btn{flex:1;min-height:48px;font-size:16px}
.btn.danger{background:var(--coral);color:#2B2147;border-color:#2B2147}
.btn.big{min-height:48px;padding:10px 26px;font-size:17px}
@keyframes popin{from{opacity:0;transform:translateY(22px) scale(.86)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}to{opacity:1}}
@keyframes wiggle{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg)}50%{transform:rotate(9deg)}75%{transform:rotate(-5deg)}}
.ov-card .micon{margin-top:-70px}
/* ---------- การ์ดสถานะ (หน้าต้อนรับ/ข้อผิดพลาด/เข้าไม่ได้) ---------- */
.statecard{max-width:460px;margin:28px auto;text-align:center;background:var(--surface);color:var(--ink);border:3px solid var(--ink);border-radius:28px;padding:18px 22px 26px;box-shadow:0 10px 0 rgba(91,63,208,.2);animation:popin .35s cubic-bezier(.34,1.56,.64,1)}
.statecard h2{font-size:23px;margin:4px 0 8px}
.statecard p{margin:0 0 14px;line-height:1.55}
.statecard details{margin:0 0 14px;text-align:left;font-size:13px;color:var(--muted)}
.statecard code{display:block;margin-top:6px;padding:8px 10px;background:var(--soft);border-radius:10px;word-break:break-all;color:var(--ink)}
.mascot{position:relative;width:190px;height:150px;margin:0 auto 4px;background:radial-gradient(circle at 50% 78%,var(--soft) 0,transparent 68%)}
.mascot svg{width:100%;height:100%;display:block}
.mascot .badge-emoji{position:absolute;right:6px;top:6px;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:var(--sun);color:#2B2147;border:3px solid var(--ink);box-shadow:0 4px 0 rgba(0,0,0,.2);animation:wiggle 2.4s ease-in-out infinite}
.grown{animation:popin .4s cubic-bezier(.34,1.56,.64,1);box-shadow:0 5px 0 rgba(0,0,0,.2)}

/* ---------- หน้าโหลด / กำลังทำงาน ---------- */
.loadcard{max-width:420px;margin:36px auto;text-align:center;background:var(--surface);color:var(--ink);border:3px solid var(--ink);border-radius:28px;padding:20px 24px 26px;box-shadow:0 10px 0 rgba(91,63,208,.2);animation:popin .35s cubic-bezier(.34,1.56,.64,1)}
.loadegg{position:relative;width:132px;height:150px;margin:0 auto 2px}
.loadegg svg{width:100%;height:100%;overflow:visible;display:block}
.loadegg .glow{animation:glow 1.8s ease-in-out infinite}
.crack{animation:crack 2.4s ease-in-out infinite}
.sparkle{position:absolute;color:var(--sun);font-size:20px;line-height:1;animation:tw 1.8s ease-in-out infinite}
.loadmsg{font-family:'Mali','Sarabun',system-ui,sans-serif;font-weight:700;font-size:21px;margin:4px 0 2px}
.loadtip{color:var(--muted);font-size:14px;min-height:22px;margin:0;transition:opacity .25s}
.loadtip.fade{opacity:0}
.dots{display:inline-flex;gap:6px;margin:10px 0 2px}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--primary);animation:dotbounce 1s ease-in-out infinite}
.dots i:nth-child(2){animation-delay:.15s;background:var(--mint)}
.dots i:nth-child(3){animation-delay:.3s;background:var(--sun)}
.dots.small{margin:0;gap:4px}.dots.small i{width:7px;height:7px}
.loadbar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden;margin:12px 6px 0}
.loadbar i{display:block;height:100%;width:42%;border-radius:99px;background:linear-gradient(90deg,var(--mint),var(--sun));animation:slide 1.3s ease-in-out infinite}
@keyframes dotbounce{0%,80%,100%{transform:translateY(0);opacity:.6}40%{transform:translateY(-9px);opacity:1}}
@keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
@keyframes glow{0%,100%{opacity:.1}50%{opacity:.75}}
@keyframes crack{0%,25%{opacity:0}45%,85%{opacity:1}100%{opacity:0}}
#busy{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);z-index:95;pointer-events:none}
.busypill{display:flex;align-items:center;gap:10px;background:var(--surface);color:var(--ink);border:3px solid var(--ink);border-radius:999px;padding:5px 16px 5px 8px;font-weight:700;white-space:nowrap;box-shadow:0 5px 0 rgba(0,0,0,.2);animation:pilldrop .3s cubic-bezier(.34,1.56,.64,1)}
.busyegg{width:32px;height:36px;flex:none;overflow:visible}
@keyframes pilldrop{from{opacity:0;transform:translateY(-16px) scale(.9)}to{opacity:1;transform:none}}
body.is-busy,body.is-busy .btn{cursor:progress}
.hatching-egg{width:190px;max-width:70%;margin:6px auto;display:block}

/* ---------- ปรับ UI ฝั่งครู ---------- */
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px}
.tabs button{transition:border-color .15s,background .15s}
.tabs button:hover{border-color:var(--primary);color:var(--ink)}
@media (max-width:700px){
  .tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -4px 14px;padding:2px 4px 6px;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
  .tabs::-webkit-scrollbar{display:none}
}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 4px rgba(124,98,230,.22)}
.btn{transition:transform .12s ease,box-shadow .12s ease,opacity .12s}
.btn:not([disabled]):hover{transform:translateY(-1px)}
.btn:not([disabled]):active{transform:translateY(1px)}
.tablewrap{overflow:auto;max-height:68vh;border:2px solid var(--line);border-radius:14px}
thead th{position:sticky;top:0;z-index:2}
th:first-child{z-index:3}
tbody tr:hover td{background:var(--soft)}
.sec{background:var(--bg);border:2px solid var(--line);border-radius:18px;padding:14px 14px 16px;margin-bottom:14px}
.sec h3{font-size:17px;margin:0 0 4px}
.sec .sub{color:var(--muted);font-size:14px;margin:0 0 12px}
.searchrow{display:flex;gap:10px;flex-wrap:wrap}
.search{flex:1;min-width:200px;display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:0 12px}
.search:focus-within{border-color:var(--primary);box-shadow:0 0 0 4px rgba(124,98,230,.22)}
.search input{border:0;box-shadow:none!important;background:transparent;flex:1;min-width:0;min-height:42px;padding:0}
.selbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:10px 0}
.pick{list-style:none;margin:0;padding:0 2px 0 0;display:grid;gap:6px;max-height:300px;overflow-y:auto}
.pick.tall{max-height:62vh}
.pickrow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:8px 12px;cursor:pointer;color:var(--ink);font:inherit}
.pickrow:hover{border-color:var(--primary)}
.pickrow.on{background:var(--soft);border-color:var(--primary)}
.pickrow input{width:20px;height:20px;min-height:0;accent-color:var(--primary);flex:none;padding:0}
.pinfo{display:grid;flex:1;min-width:0}
.pinfo b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pinfo small{color:var(--muted)}
.emptyrow{color:var(--muted);text-align:center;padding:12px;font-size:14px}
.awgrid{display:grid;grid-template-columns:150px 1fr;gap:12px}
.awgrid label{display:grid;gap:4px;font-weight:700;font-size:14px;min-width:0}
.awgrid input{width:100%;min-width:0}
@media (max-width:520px){.awgrid{grid-template-columns:1fr}}
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-top:10px}
.awfoot{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:14px}
.awsum{margin:0;flex:1;min-width:200px}
.plus{color:var(--ok)}
.detgrid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.detgrid{grid-template-columns:320px minmax(0,1fr);align-items:start}.detside{position:sticky;top:8px}}
.dethead{display:flex;gap:16px;flex-wrap:wrap;align-items:center}
.petthumb{width:124px;height:112px;flex:none;background:radial-gradient(circle at 50% 80%,var(--soft),transparent 70%)}
.petthumb svg{width:100%;height:100%;display:block}
.detinfo{flex:1;min-width:220px}
.stats{display:flex;gap:20px;flex-wrap:wrap;margin:8px 0 10px}
.stats small{display:block;color:var(--muted);font-size:12px}
.stats b{font-family:'Mali','Sarabun',system-ui,sans-serif;font-size:22px}
.bar2{height:12px;background:var(--soft);border-radius:99px;overflow:hidden}
.bar2 i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--sun));border-radius:99px;transition:width .4s}
.detbtns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.subhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}
.alist{display:grid;gap:2px;margin-top:8px}
.arow{display:flex;justify-content:space-between;gap:10px;align-items:center;border-bottom:1px dashed var(--line);padding:6px 0}
.arow:last-child{border-bottom:0}
.ainput input{width:84px;text-align:center}
.linkbtn{border:0;background:transparent;padding:0;font:inherit;font-weight:700;color:var(--primary);text-align:left;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.emptydet{text-align:center;padding:44px 16px}
.bigemoji{font-size:54px;line-height:1.1;margin-bottom:6px}
.tsvbox{margin-top:12px}
.tsvbox summary{cursor:pointer;font-weight:700;color:var(--muted)}

/* ---------- ตัวบอกสถานะอัปเดตสด ---------- */
.live{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);padding:4px 10px;border-radius:999px;background:var(--soft)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:livepulse 2.4s ease-in-out infinite}
.live.slow i{background:var(--sun);animation:none}
.live.off i{background:var(--coral);animation:none}
@keyframes livepulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ================= โทนสบายตา: ลดกรอบหนา เงาแข็ง กล่องซ้อนกล่อง และสีฉูดฉาด ================= */
:root{--shadow:0 1px 2px rgba(43,33,71,.06),0 6px 18px rgba(43,33,71,.06)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25)}}
:root[data-theme="dark"]{--shadow:0 1px 2px rgba(0,0,0,.3),0 6px 18px rgba(0,0,0,.25)}
.panel{border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:18px}
.scene{border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow)}
.scene .cap{border-top:1px solid var(--line);padding:10px 14px}
.scene .cap input{border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;padding:4px 2px;font-size:19px;min-height:0}
.scene .cap input:hover{border-bottom-color:var(--line)}
.scene .cap input:focus{border-bottom-color:var(--primary);box-shadow:none}
.stagepill{background:var(--soft);color:var(--ink);font-weight:600;font-size:13px}
.grown{border:0;background:var(--sun);box-shadow:var(--shadow)}
.scenehint{margin:10px 4px 0;text-align:center;font-size:13px}
.summary{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:center}
.sumpoints{display:grid;gap:2px;text-align:center;padding-left:20px;border-left:1px solid var(--line);min-width:130px}
.sumpoints b{font-family:'Mali','Sarabun',system-ui,sans-serif;font-size:34px;line-height:1.1}
.sumpoints .hint{font-size:12px}
@media (max-width:560px){.summary{grid-template-columns:1fr;gap:12px}.sumpoints{border-left:0;border-top:1px solid var(--line);padding:12px 0 0}}
.bigscore b{font-size:38px}
.bar{height:12px;margin-bottom:34px}
.bar em{opacity:.3}
/* แท็บแบบเส้นใต้ */
.tabs{gap:2px 6px;border-bottom:1px solid var(--line);margin:0 0 16px;padding-bottom:0}
.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:transparent;padding:10px 12px;margin-bottom:-1px;font-weight:600;color:var(--muted)}
.tabs button:hover{color:var(--ink);background:transparent;border-color:transparent}
.tabs button[aria-selected="true"]{background:transparent;color:var(--primary);border-bottom-color:var(--primary)}
@media (max-width:700px){.tabs{padding-bottom:0}}
/* ปุ่ม */
.btn{border:1px solid var(--line);font-weight:600;background:var(--surface);color:var(--ink)}
.btn:not([disabled]):hover{border-color:var(--primary);transform:none}
.btn.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn.primary:not([disabled]):hover{filter:brightness(1.1)}
.btn.sun{background:var(--sun);color:#2B2147;border-color:var(--sun)}
.btn.danger{background:var(--coral);color:#2B2147;border-color:var(--coral)}
select,input[type=text],input[type=number],input[type=search]{border:1px solid var(--line)}
/* รายการแบบแถวเรียบ (ไม่มีกรอบรอบทุกแถว) */
.list{gap:0}
.list li{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:10px 2px}
.list li:last-child{border-bottom:0}
.sec{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:0 0 20px;margin:0 0 20px}
.sec:last-child{border-bottom:0;margin-bottom:0;padding-bottom:0}
.sec h3{font-size:16px}
.detside{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:0}
.pickrow{border:1px solid var(--line)}
.pickrow.on{border-color:var(--primary)}
.tablewrap{border:1px solid var(--line)}
th{font-weight:600}
td input[type=number],.ainput input[type=number]{width:64px;background:transparent;border:1px solid transparent;border-bottom-color:var(--line);border-radius:8px;padding:6px 4px;text-align:center;-moz-appearance:textfield;appearance:textfield}
td input[type=number]::-webkit-inner-spin-button,.ainput input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
td input[type=number]:hover,.ainput input[type=number]:hover{border-color:var(--line)}
td input[type=number]:focus,.ainput input[type=number]:focus{background:var(--surface);border-color:var(--primary)}
.search input[type=search]{border:0;box-shadow:none}
.tabs button{padding:10px 8px;font-size:15px}
.linkbtn{text-decoration:none;color:var(--ink)}
.linkbtn:hover{color:var(--primary);text-decoration:underline}
/* ร้านค้าเป็นแถว แทนการ์ดใหญ่ */
.items{display:block}
.item{display:grid;grid-template-columns:36px 1fr auto;grid-template-areas:"em nm btn" "em pr btn";column-gap:12px;align-items:center;text-align:left;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:8px 2px}
.item.on{background:transparent;border-bottom-color:var(--line)}
.item .em{grid-area:em;font-size:24px;line-height:1}
.item .nm{grid-area:nm;text-align:left;font-weight:600}
.item .pr{grid-area:pr;text-align:left;margin:0}
.item .btn{grid-area:btn;min-width:72px}
.grp{margin:18px 0 2px;font-size:13px}
/* หน้าต่าง แจ้งเตือน การ์ดสถานะ */
.modal,.ov-card{border:1px solid var(--line);box-shadow:0 24px 60px rgba(22,17,43,.35)}
.statecard,.loadcard{border:1px solid var(--line);box-shadow:var(--shadow)}
.micon{border:4px solid var(--surface);box-shadow:var(--shadow)}
.mascot .badge-emoji{border:3px solid var(--surface);box-shadow:none;animation:none}
.loadegg .sparkle{display:none}
.toast{border:1px solid var(--line);box-shadow:0 8px 24px rgba(22,17,43,.2)}
.ticon{border:0;width:34px;height:34px;font-size:17px;font-weight:700}
#toasts{left:auto;right:18px;transform:none;width:min(92vw,360px)}
@media (max-width:640px){#toasts{left:50%;right:auto;transform:translateX(-50%)}}
.busypill{border:1px solid var(--line);box-shadow:var(--shadow)}
.sicon{flex:none;color:var(--muted)}

/* ---------- ลำดับนักเรียน (เลขที่) ---------- */
.no{display:inline-block;min-width:1.9em;color:var(--muted);font-weight:600;font-size:13px}
.ordtools{display:flex;gap:8px;flex-wrap:wrap}
.ordlist{list-style:none;margin:12px 0 0;padding:0}
.ordrow{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--line);background:var(--surface);cursor:grab;transition:background .12s}
.ordrow:hover{background:var(--soft)}
.ordrow.dragging{opacity:.35}
.ordrow.over{background:var(--soft);box-shadow:inset 0 3px 0 var(--primary)}
.grip{color:var(--muted);letter-spacing:-3px;user-select:none;font-size:18px;line-height:1}
.ordno{width:62px;text-align:center;padding:6px 4px}
.ordbtns{display:flex;gap:6px}
.ordfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:14px}

/* ---------- ร้านตกแต่งสัตว์เลี้ยง ---------- */
.cats{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 6px}
.cats button{border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--surface);font-weight:600;color:var(--muted);font-size:14px}
.cats button:hover{border-color:var(--primary);color:var(--ink)}
.cats button[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.wearing{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 12px}
.wchip{display:inline-flex;align-items:center;gap:6px;background:var(--soft);border-radius:999px;padding:3px 4px 3px 10px;font-size:13px}
.wchip button{border:0;background:transparent;color:var(--muted);font-size:17px;line-height:1;padding:0 6px;border-radius:999px}
.wchip button:hover{color:var(--ink);background:var(--line)}
.item .ibtns{grid-area:btn;display:flex;gap:6px}
.trybar{position:absolute;left:12px;right:12px;top:12px;z-index:3;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:8px 10px;box-shadow:var(--shadow);animation:popin .25s ease-out}
.trybar span{font-weight:600}

/* ================= ตกแต่งเว็บ: ธีมสี พื้นหลัง หัวเว็บ ปฏิสัมพันธ์ ================= */
:root[data-skin="ocean"]{--primary:#2563EB;--on-primary:#FFFFFF;--soft:#E3EEFF;--line:#CFE0FA;--bg:#EFF5FF}
@media (prefers-color-scheme:dark){:root[data-skin="ocean"]:not([data-theme="light"]){--primary:#7AA7FF;--on-primary:#0F1630;--soft:#1E2A4A;--line:#2F3F66;--bg:#0F1630}}
:root[data-skin="mint"]{--primary:#0F9D74;--on-primary:#FFFFFF;--soft:#DDF6EC;--line:#C4EBDB;--bg:#EEFBF5}
@media (prefers-color-scheme:dark){:root[data-skin="mint"]:not([data-theme="light"]){--primary:#5ED9AC;--on-primary:#0E211C;--soft:#163A31;--line:#25544A;--bg:#0E211C}}
:root[data-skin="peach"]{--primary:#E8590C;--on-primary:#FFFFFF;--soft:#FFE8D9;--line:#FAD3BA;--bg:#FFF4EC}
@media (prefers-color-scheme:dark){:root[data-skin="peach"]:not([data-theme="light"]){--primary:#FF9A63;--on-primary:#20120B;--soft:#3F2619;--line:#5E3A27;--bg:#20120B}}
:root[data-skin="sakura"]{--primary:#D6336C;--on-primary:#FFFFFF;--soft:#FFE3EE;--line:#F9CADC;--bg:#FFF1F6}
@media (prefers-color-scheme:dark){:root[data-skin="sakura"]:not([data-theme="light"]){--primary:#FF7FAA;--on-primary:#1E0E16;--soft:#3D1B2A;--line:#5A2B3F;--bg:#1E0E16}}
:root[data-skin="navy"]{--primary:#1E3A8A;--on-primary:#FFFFFF;--soft:#E6ECFA;--line:#CBD6F0;--bg:#F1F4FB}
@media (prefers-color-scheme:dark){:root[data-skin="navy"]:not([data-theme="light"]){--primary:#8FA8FF;--on-primary:#0C1020;--soft:#1B2447;--line:#2B3868;--bg:#0C1020}}

header.top{position:relative}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{width:50px;height:50px;border-radius:15px;display:grid;place-items:center;font-size:28px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:contain}
.logo.imglogo{border:0;background:transparent;box-shadow:0 3px 10px rgba(30,60,200,.25);border-radius:13px}
.brand h1{font-size:22px;line-height:1.15}
.brand p{margin:2px 0 0;color:var(--muted);font-size:14px}
.iconbtn{width:38px;height:38px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{border-color:var(--primary);color:var(--primary)}
#prefs{position:absolute;right:0;top:100%;z-index:60;margin-top:8px}
#prefs[hidden]{display:none}
.prefs-pop{width:min(92vw,330px);background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px;box-shadow:0 18px 50px rgba(22,17,43,.28);padding:16px;animation:popin .2s ease-out}
.pgroup{margin:12px 0}
.skins{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.skin{width:34px;height:34px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer;position:relative;padding:0}
.skin:hover{transform:scale(1.08)}
.skin[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.skin[aria-pressed="true"]::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-weight:700;font-size:15px}
.switch{display:flex;align-items:center;gap:10px;margin:12px 0;font-weight:600}
.switch input{width:18px;height:18px;accent-color:var(--primary)}
.foot{margin:20px 0 8px;text-align:center;color:var(--muted);font-size:12px}
html.skydark .brand h1,html.skydark .brand p,html.skydark .foot,html.skydark .scenehint{color:#F4F1FF}
html.skydark .brand p,html.skydark .foot,html.skydark .scenehint{opacity:.88}
html.nomo *,html.nomo *::before,html.nomo *::after{animation:none!important;transition:none!important}
/* พื้นหลังเว็บ */
#bg{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;--hill1:color-mix(in srgb,var(--primary) 22%,var(--sky2,#EAF7FF));--hill2:color-mix(in srgb,var(--primary) 14%,var(--sky2,#EAF7FF))}
#bg.bg-sky{background:linear-gradient(180deg,var(--sky1,#BFE9FF),var(--sky2,#EAF7FF))}
@media (prefers-color-scheme:dark){#bg.bg-sky{filter:brightness(.6) saturate(.9)}}
#bg.bg-dots{background-image:radial-gradient(var(--line) 1.4px,transparent 1.5px);background-size:22px 22px}
#bg .layer{position:absolute;inset:-40px;will-change:transform;transition:transform .3s ease-out}
.sun{position:absolute;width:64px;height:64px;margin:-32px 0 0 -32px;border-radius:50%;background:radial-gradient(circle,#FFF3B0 30%,#FFD43B 62%);box-shadow:0 0 60px 18px rgba(255,212,59,.45);transition:top 2s,left 2s}
.sun.moon{background:radial-gradient(circle at 35% 35%,#fff 0,#E8E4FF 55%,#CFC9F5);box-shadow:0 0 40px 10px rgba(207,201,245,.35)}
.stars{position:absolute;inset:0;transition:opacity 2s}
.star{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;animation:twinkle 3.2s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
.cloud{position:absolute;left:0;opacity:.92;animation:drift linear infinite;filter:brightness(var(--cloud-b,1))}
.cloud svg{display:block}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(125vw)}}
.hills{position:absolute;left:0;right:0;bottom:0;width:100%;height:32%}
.floater{position:absolute;bottom:-90px;border:0;background:transparent;cursor:pointer;pointer-events:auto;padding:0;animation:rise 18s linear forwards}
.floater:hover{filter:brightness(1.08)}
@keyframes rise{0%{transform:translate(0,0)}25%{transform:translate(18px,-28vh)}50%{transform:translate(-14px,-58vh)}75%{transform:translate(14px,-88vh)}100%{transform:translate(0,-128vh)}}
.pop{position:fixed;width:9px;height:9px;margin:-4px;border-radius:50%;pointer-events:none;z-index:99;animation:burst .7s ease-out forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(.3);opacity:0}}
#bg.bg-aurora .blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.42;animation:blobfloat 22s ease-in-out infinite}
.blob.b1{width:46vw;height:46vw;left:-8vw;top:-10vw;background:var(--primary)}
.blob.b2{width:40vw;height:40vw;right:-6vw;top:20vh;background:var(--mint);animation-delay:-8s}
.blob.b3{width:36vw;height:36vw;left:30vw;bottom:-14vw;background:var(--sun);animation-delay:-15s}
@keyframes blobfloat{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(6vw,-4vh) scale(1.12)}}
/* โต้ตอบ: ริปเปิล ตัวเลขนับ การ์ดสถิติ */
.btn,.tabs button,.cats button,.stat{position:relative;overflow:hidden}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.18;transform:scale(0);animation:rip .55s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
.bump{animation:bump .4s ease-out}
@keyframes bump{40%{transform:scale(1.14)}}
.statstrip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:0 0 14px}
@media (max-width:640px){.statstrip{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 14px;text-align:left;box-shadow:var(--shadow);cursor:pointer;color:var(--ink);transition:transform .15s,border-color .15s}
.stat:hover{transform:translateY(-2px);border-color:var(--primary)}
.statnum{display:block;font-family:'Mali','Sarabun',system-ui,sans-serif;font-size:26px;font-weight:700;line-height:1.15}
.statlabel{color:var(--muted);font-size:13px}
.stat.alert .statnum{color:var(--warn)}
.panel,.sec,.stat{transition:box-shadow .2s}
.item:hover{background:var(--soft)}
.scene svg[data-act]{transition:filter .2s}
.scene:hover svg[data-act]{filter:drop-shadow(0 4px 10px rgba(43,33,71,.12))}
.locked{cursor:not-allowed}
.lockico{font-size:16px;margin-left:-4px}

/* ---------- กรอกคะแนนหลายคน ---------- */
.chkgrid{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 12px}
.chkrow{display:inline-flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--surface);font-weight:600;font-size:14px;cursor:pointer}
.chkrow input{accent-color:var(--primary);width:16px;height:16px}
.chkrow:has(input:checked){border-color:var(--primary);background:var(--soft)}

.old{color:var(--muted);text-decoration:line-through;margin-right:4px}
.bulksum{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0;font-size:14px}
.bulksum b{font-size:16px}
.rowerr td{background:rgba(255,127,127,.10)}

.awwrap>.sec:nth-child(2){border-bottom:0;padding-bottom:0;margin-bottom:0}
.awwrap>.awfoot{border-bottom:1px solid var(--line);padding-bottom:20px;margin:14px 0 20px}

.tview .backpick{display:none}
@media (max-width:720px){
  .is-teacher .wrap{padding:10px 12px 28px}
  .is-teacher header.top{gap:8px 12px;margin-bottom:10px}
  .is-teacher .logo{width:42px;height:42px;font-size:24px;border-radius:12px}
  .is-teacher .brand h1{font-size:19px}
  .is-teacher .brand p{font-size:12.5px}
  .is-teacher .ctrls{width:100%;justify-content:flex-start;flex-wrap:nowrap;gap:8px}
  .is-teacher .ctrls .chip{min-width:0;flex:1;max-width:none;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .is-teacher .iconbtn{flex:none}
  .is-teacher #prefs{right:0;left:0;display:flex;justify-content:flex-end}
  /* การ์ดสรุป: แถวเดียว 4 ช่อง */
  .is-teacher .statstrip{grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
  .is-teacher .stat{padding:8px 8px 7px;border-radius:12px}
  .is-teacher .statnum{font-size:21px}
  .is-teacher .statlabel{font-size:11px;line-height:1.25;display:block}
  /* แผงหลัก */
  .tview .panel{padding:0 12px 16px;border-radius:16px}
  .tview .tabs{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;margin:0 -12px 12px;padding:0 6px;position:sticky;top:0;z-index:30;background:var(--surface);border-radius:16px 16px 0 0;scroll-snap-type:x proximity}
  .tview .tabs::-webkit-scrollbar{display:none}
  .tview .tabs button{flex:none;white-space:nowrap;padding:14px 12px;font-size:15px;scroll-snap-align:center}
  /* พิมพ์ได้ไม่ซูม และกดง่ายด้วยนิ้ว */
  .tview input,.tview select,.tview textarea{font-size:16px}
  .tview select,.tview input[type=text],.tview input[type=search],.tview input[type=number]{min-height:44px}
  .tview .btn{min-height:44px}
  .tview .btn.small{min-height:40px;padding:8px 14px}
  .tview .searchrow{gap:8px}.tview .search{flex:1 1 100%}.tview .searchrow select{flex:1}
  .tview .sec h3{font-size:17px}
  .tview .hint,.tview .sub{font-size:13.5px}
  /* ตารางกรอกคะแนน: คอลัมน์ชื่อตรึงซ้าย เลื่อนดูคะแนนในแนวนอน */
  .tview .tablewrap{margin:0 -12px;border-radius:0;border-left:0;border-right:0;max-height:none}
  .scoretbl{min-width:0;font-size:15px}
  .scoretbl th,.scoretbl td{padding:6px 5px}
  .scoretbl th:first-child,.scoretbl td:first-child{position:sticky;left:0;z-index:2;background:var(--surface);min-width:112px;max-width:120px;box-shadow:1px 0 0 var(--line);text-align:left}
  .scoretbl th:first-child{background:var(--soft)}
  .scoretbl td:first-child .linkbtn{display:inline-block;max-width:92px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:bottom;text-align:left}
  .scoretbl td:first-child small{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .scoretbl td:first-child .no{display:inline-block;min-width:1.6em}
  .scoretbl td:first-child .linkbtn{display:-webkit-inline-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;white-space:normal;max-width:86px;vertical-align:top;line-height:1.25;text-overflow:ellipsis}
  .scoretbl td:first-child .no{vertical-align:top;padding-top:1px}
  .scoretbl td input[type=number]{width:62px;min-height:44px;height:44px;font-size:17px}
  .scoretbl th{white-space:nowrap}
  .reptbl{min-width:0}.reptbl th,.reptbl td{padding:6px 7px;white-space:nowrap}
  /* ดูรายบุคคล: เลือกแล้วพับรายชื่อเก็บ */
  .detgrid.sel .detside{display:none}
  .detgrid.sel .backpick{display:inline-flex;margin-bottom:10px}
  .detside{position:static}
  .pick.tall{max-height:46vh}
  .dethead{gap:12px}
  /* ปุ่มบันทึก/มอบแต้ม ลอยติดขอบล่างให้กดได้ตลอด */
  .awfoot,.ordfoot{position:sticky;bottom:0;z-index:25;background:var(--surface);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px));margin:12px 0 0;border-top:1px solid var(--line);box-shadow:0 -6px 12px -8px rgba(22,17,43,.25)}

  .ordfoot>div{flex:1;display:flex;gap:8px}
  .awfoot .awsum{flex:1 1 100%;margin:0}

  .ordrow{gap:8px;padding:8px 2px}
  .ordrow .grip{display:none}
  .ordrow .pinfo b{white-space:normal;overflow:visible;text-overflow:clip}
  .ordno{width:56px}
  .ordbtns .btn{width:44px;min-width:44px;height:44px;padding:0;font-size:18px}

  .tview .list li{gap:8px;flex-wrap:nowrap;align-items:center}
  .tview .list li>input[type=text]{min-width:0!important;flex:1 1 0;width:0}
  .tview .list li>label{flex:none;display:flex;align-items:center;gap:4px;white-space:nowrap}
  .tview .list li>label input{width:58px!important}
  .tview .list li>.btn,.tview .list li>.hint{flex:none}
  /* เพิ่มวิชา/งาน และฟอร์มต่างๆ */
  .tview #new-sub,.tview #new-asg-name{min-width:0!important;flex:1 1 100%!important}
  /* วางหลายคน */
  .bulkbox{min-height:150px}
  .bulksum{gap:8px 12px}
  #bulk-preview .tablewrap{max-height:300px}
  #bulk-preview td:nth-child(3){max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #bulk-preview th,#bulk-preview td{padding:6px 6px}
  /* แกลเลอรีและอื่นๆ */
  .galwrap{margin:0 -12px;padding:0 12px}
  .gallery .gn{position:sticky;left:0;z-index:2;background:var(--surface)}
  .tview .chkrow{padding:8px 14px}
  .tview .cats button{padding:8px 14px;font-size:15px}
}
@media (pointer:coarse){ .ordrow{cursor:default} .ordrow .grip{display:none} }

/* ---------- เทอมใหม่: สำรอง กู้คืน ล้างข้อมูล ---------- */
.optlist{display:grid;gap:8px;margin:8px 0 12px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);cursor:pointer}
.opt input{margin-top:3px;width:18px;height:18px;accent-color:var(--primary);flex:none}
.opt b{display:block;font-size:15px}
.opt small{color:var(--muted);display:block;font-size:13px;line-height:1.35}
.opt:has(input:checked){border-color:var(--primary);background:var(--soft)}
.opt.off{opacity:.5;pointer-events:none}
.effect{background:rgba(255,127,127,.12);border:1px solid rgba(255,127,127,.45);border-radius:12px;padding:10px 14px;margin:8px 0 12px;font-size:14.5px}
.effect ul{margin:6px 0 0;padding-left:20px}
.bkrow b{display:block}
.confirmbox{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px}
.confirmbox input{flex:1;min-width:160px;border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--surface);color:var(--ink);font:inherit}
@media (max-width:720px){.confirmbox .btn{flex:1 1 100%}.bkrow{flex-wrap:wrap}}

const SKINS=[['grape','ม่วงพาสเทล','#5B3FD0'],['ocean','ฟ้าทะเล','#2563EB'],['mint','เขียวมินต์','#0F9D74'],['peach','ส้มพีช','#E8590C'],['sakura','ชมพูซากุระ','#D6336C'],['navy','กรมท่า','#1E3A8A']];
const BG_STYLES=[['sky','ท้องฟ้า'],['aurora','ออโรรา'],['dots','ลายจุด'],['plain','เรียบ']];
let PREFS={skin:SITE.skin,bg:SITE.bg,motion:true};
(function loadPrefs(){
  try{
    const o=JSON.parse(localStorage.getItem('petclass-prefs')||'null');
    if(o){ if(SKINS.some(x=>x[0]===o.skin)) PREFS.skin=o.skin; if(BG_STYLES.some(x=>x[0]===o.bg)) PREFS.bg=o.bg; if(typeof o.motion==='boolean') PREFS.motion=o.motion; }
  }catch(e){}
})();
function savePrefs(){ try{ localStorage.setItem('petclass-prefs',JSON.stringify(PREFS)); }catch(e){} }

function timeGreeting(h){ return h>=5&&h<11?'อรุณสวัสดิ์':h>=11&&h<13?'สวัสดีตอนเที่ยง':h>=13&&h<17?'สวัสดีตอนบ่าย':h>=17&&h<21?'สวัสดีตอนเย็น':'ราตรีสวัสดิ์'; }
function applySite(){
  document.title=SITE.name;
  const n=document.getElementById('site-name'); if(n) n.textContent=SITE.name;
  const lg=document.getElementById('logo');
  if(lg){ const isImg=/^(https?:|data:)/.test(SITE.logo); lg.innerHTML=isImg?'<img alt="" src="'+String(SITE.logo).replace(/"/g,'&quot;')+'">':String(SITE.logo).replace(/[<>&]/g,''); lg.classList.toggle('imglogo',isImg); }
  updateHeader();
}
function updateHeader(){
  const el=document.getElementById('site-sub'); if(!el) return;
  let t=SITE.tagline;
  if(typeof state!=='undefined' && state.me && (state.me.role==='student'||state.me.role==='teacher')){
    const who=state.me.role==='teacher'?'ครู':(state.st?(state.st.first_name||state.st.name):'');
    const d=new Date();
    t=timeGreeting(d.getHours())+(who?' '+who:'')+' · '+d.toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  }
  el.textContent=t;
}

const SKY_KEYS=[[0,'#141846','#2B2F78'],[5,'#2B2F78','#6B5B95'],[6.5,'#FFB38A','#FFE0C2'],[8,'#8FD3FF','#E6F6FF'],[12,'#6EC6FF','#E3F5FF'],[16,'#8FD3FF','#EAF7FF'],[17.5,'#FF9E7A','#FFD9A8'],[18.5,'#6B5B95','#F5A6B8'],[19.5,'#232A66','#3A3F8F'],[24,'#141846','#2B2F78']];
function hex2rgb(x){ const n=parseInt(x.slice(1),16); return [n>>16&255,n>>8&255,n&255]; }
function mixHex(a,b,t){ const A=hex2rgb(a),B=hex2rgb(b); return 'rgb('+A.map((v,i)=>Math.round(v+(B[i]-v)*t)).join(',')+')'; }
function skyAt(h){
  for(let i=0;i<SKY_KEYS.length-1;i++){ const a=SKY_KEYS[i], b=SKY_KEYS[i+1]; if(h>=a[0]&&h<=b[0]){ const t=(h-a[0])/((b[0]-a[0])||1); return [mixHex(a[1],b[1],t),mixHex(a[2],b[2],t)]; } }
  return [SKY_KEYS[0][1],SKY_KEYS[0][2]];
}
const CLOUD_D='M30 52 Q4 52 6 34 Q8 18 28 20 Q34 4 56 8 Q76 -2 90 18 Q114 10 124 30 Q150 30 150 44 Q150 54 132 54Z';

    });

function countTo(el,from,to,fmt){
  if(!el) return;
  const t0=performance.now(), dur=Math.min(1100,350+Math.abs(to-from)*22);
  el.classList.add('bump');
  (function step(now){
    const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,3), v=from+(to-from)*e;
    el.textContent=fmt?fmt(k<1?v:to):(k<1?Math.round(v*10)/10:to);
    if(k<1) requestAnimationFrame(step); else setTimeout(()=>el.classList.remove('bump'),350);
  })(t0);
}

function sceneSVG(s, st, pending){
  let inner;
  if(st<2 || pending){
    const lv = st===0 ? 0 : (pending ? 2 : 1);
    inner = '<g class="'+(st===0?'':'wob')+'">'+eggG(s.species, lv)+'</g>';
  } else {
    // กระโดดเล็กๆ เป็นระยะ
    const hop = reducedMotion() ? '' : '<animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -16;0 0;0 -8;0 0;0 0" keyTimes="0;.62;.68;.74;.79;.84;1" dur="8s" repeatCount="indefinite"/>';

  }

    +'<g transform="translate(150,224)"><g class="petmove">'+inner+'</g></g></svg>';

function renderGallery(){
  const head='<div></div>'+STAGES.map((g,i)=>'<div class="gh">ระยะ '+(i+1)+'<br><b>'+g.name+'</b></div>').join('');
  const rows=Object.keys(COL).map(k=>{

      const inner = st<2 ? eggG(k,st) : petG(k,st,{});
      cells+='<div class="gc"><svg viewBox="-100 -138 200 148" role="img" aria-label="'+COL[k].name+' ระยะ '+(st+1)+' '+STAGES[st].name+'"><g class="'+(st===1?'wob':'')+'">'+inner+'</g></svg></div>';
    }

let dlgResolve=null, dlgPrev=null;
function askConfirm(o){
  return new Promise(res=>{
    if(dlgResolve) closeDialog(false);
    suspendBusy();
    const d=$('dialog'); dlgPrev=document.activeElement; dlgResolve=res;
    const tone=o.tone||'primary';
    const rows=(o.rows||[]).map(r=>'<div><dt>'+esc(r[0])+'</dt><dd>'+esc(r[1])+'</dd></div>').join('');
    d.innerHTML='<div class="backdrop" data-dlg="backdrop"><div class="modal tone-'+tone+'" role="alertdialog" aria-modal="true" aria-labelledby="dlg-title"'+(o.message?' aria-describedby="dlg-msg"':'')+'>'
      +'<div class="micon" aria-hidden="true">'+(o.icon||'✨')+'</div>'
      +'<h3 id="dlg-title">'+esc(o.title||'')+'</h3>'
      +(o.message?'<p id="dlg-msg" class="mmsg">'+esc(o.message)+'</p>':'')

      +'<div class="mbtns">'+(o.cancelText===null?'':'<button type="button" class="btn" data-dlg="cancel">'+esc(o.cancelText||'ยกเลิก')+'</button>')
      +'<button type="button" class="btn '+(tone==='danger'?'danger':'primary')+'" data-dlg="ok">'+esc(o.confirmText||'ตกลง')+'</button></div></div></div>';
    d.hidden=false;
    // ถ้าเป็นการลบ ให้โฟกัสปุ่มยกเลิกก่อน กันกด Enter พลาด
    const f=d.querySelector && d.querySelector((tone==='danger'&&o.cancelText!==null)?'[data-dlg="cancel"]':'[data-dlg="ok"]');

function petScore(assignments, scoreMap){
  const subj={}, known={};
  assignments.forEach(a=>{ subj[a.subject_id]=true; known[a.id]=true; });
  const n=Object.keys(subj).length; if(!n) return 0;
  let sum=0; Object.keys(scoreMap).forEach(k=>{ if(known[k]) sum+=scoreMap[k]; });
  return Math.min(100, r1(sum/n));
}
function subjectTotal(subId, assignments, scoreMap){

}

  const sub='<small>'+esc(s.classroom||'ยังไม่กรอกห้อง')+(s.order_no!==null&&s.order_no!==undefined?' · เลขที่ '+s.order_no:'')+(s.student_no?' · รหัส '+esc(s.student_no):'')+' · '+s.points+' แต้ม</small>';

function pickListHTML(list,mode,isOn){
  if(!list.length) return '<li class="emptyrow">ไม่พบนักเรียนที่ตรงกับคำค้น</li>';
  return list.slice(0,PICK_LIMIT).map(s=>pickRowHTML(s,mode,isOn(s))).join('')
    +(list.length>PICK_LIMIT?'<li class="emptyrow">แสดง '+PICK_LIMIT+' จาก '+list.length+' คน พิมพ์ค้นหาเพื่อกรองเพิ่ม</li>':'');
}

/* ---------- ลำดับนักเรียนในห้อง (ให้ตรงกับเลขที่ในใบรายชื่อ) ---------- */
function roomStudents(room){ return state.T.students.filter(s=>s.classroom===room); }
function ordLoad(room){ state.ord.room=room; state.ord.list=roomStudents(room).map(s=>s.email); state.ord.dirty=false; }
function ordSync(){
  const O=state.ord; if(!O.room) return;
  const cur=roomStudents(O.room).map(s=>s.email);
  if(!O.dirty){ O.list=cur; return; }
  const set={}; cur.forEach(e=>{ set[e]=true; });
  O.list=O.list.filter(e=>set[e]); cur.forEach(e=>{ if(O.list.indexOf(e)<0) O.list.push(e); });
}
function ordMoveTo(email,pos){
  const O=state.ord, i=O.list.indexOf(email); if(i<0) return;
  pos=Math.max(0,Math.min(O.list.length-1,pos)); if(pos===i) return;
  O.list.splice(i,1); O.list.splice(pos,0,email); O.dirty=true;
}

// จับคู่บรรทัดที่วางกับนักเรียนในห้อง: ใช้รหัสนักเรียนก่อน แล้วค่อยใช้ชื่อหรืออีเมล
function ordMatchLines(text){
  const O=state.ord, pool=roomStudents(O.room).slice(), used={}, matched=[], missing=[];
  text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).forEach(line=>{
    let hit=null;
    const toks=line.split(/[\s,\t]+/).filter(Boolean);
    for(let k=0;k<toks.length && !hit;k++){ hit=pool.find(s=>!used[s.email] && String(s.student_no)===toks[k]); }
    if(!hit){ const q=normQ(line); hit=pool.find(s=>!used[s.email] && (normQ(s.name)===q || normQ(s.email)===q || (q.length>=4 && normQ(s.name).indexOf(q)>=0))); }
    if(hit){ used[hit.email]=true; matched.push(hit.email); } else missing.push(line);
  });
  return {matched:matched, missing:missing};
}

function exportBackupXlsx(d){
  const sheets=TERM_SHEETS.map(x=>({name:x[1],rows:(d.tables[x[0]]||[]).map(r=>r.map(v=>v===null||v===undefined?'':v)),plain:true}));
  const bytes=buildXlsx(sheets), dt=new Date(), p=n=>(n<10?'0':'')+n;
  downloadBytes(bytes,('สำรอง_'+d.label+'_'+dt.getFullYear()+'-'+p(dt.getMonth()+1)+'-'+p(dt.getDate())+'.xlsx').replace(/[\\\/?*:"<>|]/g,'-').replace(/\s+/g,'_'));
}

function scoreModeBar(){
  const m=state.scoreMode||'grid';
  return '<div class="cats" style="margin:0 0 12px"><button type="button" data-act="scoremode" data-v="grid" aria-pressed="'+(m==='grid')+'">กรอกในตาราง</button><button type="button" data-act="scoremode" data-v="bulk" aria-pressed="'+(m==='bulk')+'">วางหลายคน (รหัสนักเรียน)</button></div>';
}
function asciiDigits(t){ return String(t).replace(/[๐-๙]/g,c=>String(c.charCodeAt(0)-0x0E50)); }
function bulkCell(t){ const x=asciiDigits(String(t==null?'':t).trim()); return (x===''||!/^-?\d+(\.\d+)?$/.test(x))?null:Number(x); }
function bulkTokens(line){ return line.indexOf('\t')>=0 ? line.split('\t').map(x=>x.trim()) : line.trim().split(/[\s,;]+/); }
// จับคู่รหัสนักเรียน: ตรงตัวก่อน แล้วลองตัดเลข 67 นำหน้า ตัดศูนย์นำหน้า และเทียบเป็นตัวเลข
function findByNo(key){
  const T=state.T, k=asciiDigits(key).trim(); if(!k) return null;
  const cands=[k]; if(/^67\d+$/.test(k)) cands.push(k.replace(/^67/,'')); if(/^0+\d/.test(k)) cands.push(k.replace(/^0+/,''));
  for(let n=0;n<cands.length;n++){ const m=T.students.filter(s=>String(s.student_no)===cands[n]); if(m.length===1) return m[0]; }
  const num=Number(k); if(!isNaN(num)){ const m=T.students.filter(s=>s.student_no!==''&&Number(s.student_no)===num); if(m.length===1) return m[0]; }
  return null;
}
function bulkAssignments(){ const sub=curSubject(); return sub?state.T.assignments.filter(a=>a.subject_id===sub.id):[]; }
function bulkSelectedAids(){
  const list=bulkAssignments(); let ids=state.bulk.aids.filter(id=>list.some(a=>a.id===id));
  if(!ids.length && list.length) ids=[list[0].id];
  return list.filter(a=>ids.indexOf(a.id)>=0).map(a=>a.id);
}
function bulkParse(){
  const T=state.T, B=state.bulk, asg=bulkSelectedAids().map(id=>T.assignments.find(a=>a.id===id)).filter(Boolean);
  const lines=String(B.text||'').split(/\r?\n/), rows=[];
  const roomStudents=B.mode!=='id'?T.students.filter(s=>s.classroom===B.room):[];
  if(B.mode==='col') while(lines.length && !lines[lines.length-1].trim()) lines.pop();
  lines.forEach((line,i)=>{
    if(B.mode!=='col' && !line.trim()) return;
    const parts=bulkTokens(line); let student=null, cells=[], label='', err='';
    if(B.mode==='id'){ label=parts[0]||''; student=findByNo(label); cells=parts.slice(1,1+asg.length); if(!student) err='ไม่พบรหัสนี้'; }
    else if(B.mode==='no'){ label=parts[0]||''; const n=bulkCell(label); student=n!==null?roomStudents.find(s=>s.order_no===n)||null:null; cells=parts.slice(1,1+asg.length); if(!student) err=B.room?'ไม่พบเลขที่นี้ในห้อง':'เลือกห้องก่อน'; }
    else { student=roomStudents[i]||null; cells=parts.slice(0,asg.length); label=String(i+1); if(!student) err=B.room?'เกินจำนวนนักเรียนในห้อง':'เลือกห้องก่อน'; }
    rows.push({line:i+1,label:label,student:student,cells:cells,err:err});
  });
  const seen={};
  rows.forEach(r=>{
    r.vals=asg.map((a,k)=>{
      const n=bulkCell(r.cells[k]); if(n===null) return null;
      const c=Math.min(Math.max(n,0),Number(a.max_score)), v=Math.round(c*10)/10;
      const old=r.student?(T.sc[r.student.email]||{})[a.id]:undefined;
      return {v:v, raw:n, clamped:c!==n, old:typeof old==='number'?old:null, same:typeof old==='number'&&old===v};
    });
    if(r.student){ if(seen[r.student.email]) r.dup=true; seen[r.student.email]=true; }
    if(!r.err && !r.vals.some(x=>x)) r.err=B.mode==='col'?'ข้าม (ไม่มีคะแนน)':'ไม่มีคะแนน';
  });
  return {rows:rows, asg:asg};
}
function bulkStats(P){
  const st={students:0,cells:0,over:0,same:0,clamped:0,bad:0,skip:0,dup:0}, who={};
  P.rows.forEach(r=>{
    if(r.dup) st.dup++;
    if(r.err){ if(/ข้าม/.test(r.err)||/ไม่มีคะแนน/.test(r.err)) st.skip++; else st.bad++; return; }
    r.vals.forEach(x=>{ if(!x) return; if(x.clamped) st.clamped++; if(x.same){ st.same++; return; } st.cells++; if(x.old!==null) st.over++; who[r.student.email]=true; });
  });
  st.students=Object.keys(who).length; return st;
}

function renderBulkPreview(){
  const host=$('bulk-preview'); if(!host) return;
  const P=bulkParse(), st=bulkStats(P), B=state.bulk;
  const sv=$('bulk-save'); if(sv){ sv.disabled=!st.cells; sv.textContent=st.cells?'บันทึก '+st.cells+' รายการ':'บันทึก'; }
  if(!P.rows.length){ host.innerHTML=''; return; }
  const head='<tr><th>บรรทัด</th><th>'+(B.mode==='id'?'รหัส':'เลขที่')+'</th><th style="text-align:left">ชื่อ</th><th>ห้อง</th>'+P.asg.map(a=>'<th>'+esc(a.name)+'<label>เต็ม '+a.max_score+'</label></th>').join('')+'<th>สถานะ</th></tr>';
  const body=P.rows.map(r=>{
    const s=r.student;
    const cells=P.asg.map((a,k)=>{
      const x=r.vals[k]; if(!x) return '<td class="hint">–</td>';
      const nv=(x.clamped?'⚠ '+x.raw+' → ':'')+'<b>'+x.v+'</b>';
      return '<td>'+(x.old!==null&&!x.same?'<span class="old">'+x.old+'</span>':'')+(x.same?'<span class="hint">'+x.v+' (เท่าเดิม)</span>':nv)+'</td>';
    }).join('');
    const status=r.err?'<span class="st-rejected">'+esc(r.err)+'</span>':(r.dup?'<span style="color:var(--warn)">ซ้ำ ใช้รายการล่าสุด</span>':(r.vals.every(x=>!x||x.same)?'<span class="hint">ไม่เปลี่ยน</span>':'<span class="st-approved">พร้อมบันทึก</span>'));

/* ===================== สร้างไฟล์ Excel (.xlsx) ในเบราว์เซอร์ ไม่ต้องใช้ไลบรารีภายนอก ===================== */
const CRC_T = (function(){
  const t=[]; for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c = (c&1) ? (0xEDB88320 ^ (c>>>1)) : (c>>>1); t[n]=c>>>0; } return t;
})();
function crc32(u8){ let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++) c = CRC_T[(c^u8[i])&0xFF] ^ (c>>>8); return (c^0xFFFFFFFF)>>>0; }
function zipStore(files){
  const enc=new TextEncoder();
  const u16=n=>[n&255,(n>>>8)&255], u32=n=>[n&255,(n>>>8)&255,(n>>>16)&255,(n>>>24)&255];
  const parts=[], central=[]; let offset=0;
  files.forEach(f=>{
    const name=enc.encode(f.name), crc=crc32(f.data), size=f.data.length;
    const local=[0x50,0x4b,3,4].concat(u16(20),u16(0x0800),u16(0),u16(0),u16(0x21),u32(crc),u32(size),u32(size),u16(name.length),u16(0));
    parts.push(Uint8Array.from(local), name, f.data);
    central.push(Uint8Array.from([0x50,0x4b,1,2].concat(u16(20),u16(20),u16(0x0800),u16(0),u16(0),u16(0x21),u32(crc),u32(size),u32(size),u16(name.length),u16(0),u16(0),u16(0),u16(0),u32(0),u32(offset))), name);
    offset += local.length + name.length + size;
  });
  let cdSize=0; central.forEach(c=>{ cdSize+=c.length; });
  const eocd=Uint8Array.from([0x50,0x4b,5,6].concat(u16(0),u16(0),u16(files.length),u16(files.length),u32(cdSize),u32(offset),u16(0)));
  const all=parts.concat(central,[eocd]); let total=0; all.forEach(a=>{ total+=a.length; });
  const out=new Uint8Array(total); let p=0; all.forEach(a=>{ out.set(a,p); p+=a.length; });
  return out;
}
function xlColName(i){ let s=''; i++; while(i>0){ const m=(i-1)%26; s=String.fromCharCode(65+m)+s; i=Math.floor((i-1)/26); } return s; }
function xlEsc(t){ return String(t).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function xlSheetXml(rows,plain){
  let widths=[]; rows.forEach(r=>{ r.forEach((v,j)=>{ const len=(v===''||v===null||v===undefined)?0:String(v).length; widths[j]=Math.max(widths[j]||0,len); }); });
  const cols=widths.map((w,j)=>'<col min="'+(j+1)+'" max="'+(j+1)+'" width="'+Math.min(40,Math.max(j===0?5:9,w+3))+'" customWidth="1"/>').join('');
  const data=rows.map((r,i)=>{
    const st = i===0 ? ' s="1"' : (i===1 && !plain ? ' s="2"' : '');
    const cells=r.map((v,j)=>{
      if(v===''||v===null||v===undefined) return '';
      const ref=xlColName(j)+(i+1);
      if(typeof v==='number' && isFinite(v)) return '<c r="'+ref+'"'+st+'><v>'+v+'</v></c>';
      return '<c r="'+ref+'"'+st+' t="inlineStr"><is><t xml:space="preserve">'+xlEsc(v)+'</t></is></c>';
    }).join('');
    return '<row r="'+(i+1)+'">'+cells+'</row>';
  }).join('');
  const pane = rows.length>2 ? (plain?'<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/>':'<pane xSplit="3" ySplit="2" topLeftCell="D3" activePane="bottomRight" state="frozen"/>') : '';
  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0">'+pane+'</sheetView></sheetViews><sheetFormatPr defaultRowHeight="15"/><cols>'+cols+'</cols><sheetData>'+data+'</sheetData></worksheet>';
}
function xlSafeSheetName(name, used){
  let n=String(name||'Sheet').replace(/[\\\/?*\[\]:]/g,'-').replace(/^'+|'+$/g,'').slice(0,31) || 'Sheet';
  let base=n, k=2; while(used[n.toLowerCase()]){ const suf=' ('+(k++)+')'; n=base.slice(0,31-suf.length)+suf; }
  used[n.toLowerCase()]=true; return n;
}
// sheets = [{name:'ม.3-1', rows:[[...],[...]]}, ...]  แถวแรกเป็นหัวตาราง แถวที่สองเป็นคะแนนเต็ม  คืนค่า Uint8Array ของไฟล์ .xlsx
function buildXlsx(sheets){
  if(!sheets.length) sheets=[{name:'Sheet1',rows:[['ไม่มีข้อมูล']]}];
  const enc=new TextEncoder(), used={}, names=sheets.map(s=>xlSafeSheetName(s.name,used));
  const files=[];
  files.push({name:'[Content_Types].xml',data:enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+sheets.map((s,i)=>'<Override PartName="/xl/worksheets/sheet'+(i+1)+'.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>').join('')+'<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>')});
  files.push({name:'_rels/.rels',data:enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>')});
  files.push({name:'xl/workbook.xml',data:enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>'+names.map((n,i)=>'<sheet name="'+xlEsc(n)+'" sheetId="'+(i+1)+'" r:id="rId'+(i+1)+'"/>').join('')+'</sheets></workbook>')});
  files.push({name:'xl/_rels/workbook.xml.rels',data:enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'+sheets.map((s,i)=>'<Relationship Id="rId'+(i+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet'+(i+1)+'.xml"/>').join('')+'<Relationship Id="rId'+(sheets.length+1)+'" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>')});
  files.push({name:'xl/styles.xml',data:enc.encode('<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFE6E0FF"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="3"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>')});
  sheets.forEach((s,i)=>{ files.push({name:'xl/worksheets/sheet'+(i+1)+'.xml',data:enc.encode(xlSheetXml(s.rows,s.plain))}); });
  return zipStore(files);
}
function downloadBytes(bytes, filename){
  const blob=new Blob([bytes],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=filename; a.style.display='none';
  document.body.appendChild(a); a.click();
  setTimeout(()=>{ if(a.remove) a.remove(); URL.revokeObjectURL(url); },4000);
}
function xlFileName(part){
  const d=new Date(), p=n=>(n<10?'0':'')+n;

}

/* ===================== อัปเดตสด (เรียลไทม์) =====================
 * ทุก 1 วินาที หน้าเว็บถามเลขเวอร์ชันแบบเบา (ไม่อ่านชีต) ถ้าเลขเปลี่ยนจึงดึงข้อมูลจริงแล้ววาดใหม่ทันที
 * - นับ 1 วินาทีหลังได้คำตอบรอบก่อน จึงไม่มีคำขอซ้อนกัน
 * - หยุดเมื่อแท็บอยู่เบื้องหลัง และผ่อนเป็นทุก 5 วินาทีถ้าไม่มีใครใช้งานเกิน 2 นาที (ช่วยลดภาระ Apps Script)
 * - ไม่วาดทับตอนผู้ใช้กำลังพิมพ์ เลื่อนหน้า หรือมีหน้าต่างค้างอยู่ จะรอแล้วค่อยอัปเดต */
const POLL_MS=1000, POLL_IDLE_MS=5000, IDLE_AFTER=120000;
let pollTimer=null, pollLast=null, pollFail=0, pollOn=false, lastAct=Date.now();
['pointerdown','keydown','touchstart','scroll'].forEach(ev=>document.addEventListener(ev,()=>{ lastAct=Date.now(); },{passive:true}));
function setLive(mode){
  const el=$('live'); if(!el) return;
  el.className='live '+mode;
  const t=el.querySelector&&el.querySelector('span');
  if(t) t.textContent=mode==='ok'?'สด':(mode==='slow'?'พักอัปเดต':'ออฟไลน์');
  el.title=mode==='ok'?'อัปเดตข้อมูลอัตโนมัติทุก 1 วินาที':(mode==='slow'?'พักการอัปเดตชั่วคราว (ไม่มีการใช้งานหรืออยู่เบื้องหลัง)':'เชื่อมต่อไม่ได้ กำลังลองใหม่');
}
function startPolling(){ stopPolling(); pollOn=true; pollLast=null; pollFail=0; schedulePoll(POLL_MS); }
function stopPolling(){ pollOn=false; clearTimeout(pollTimer); pollTimer=null; }
function schedulePoll(ms){ clearTimeout(pollTimer); if(pollOn) pollTimer=setTimeout(pollOnce,ms); }
function pollDelay(){
  if(pollFail>=2) return Math.min(15000,POLL_MS*Math.pow(2,pollFail));
  return (Date.now()-lastAct>IDLE_AFTER)?POLL_IDLE_MS:POLL_MS;
}
function uiSafe(){
  if(busy) return false;
  if(Date.now()-lastAct<600) return false;                 // ผู้ใช้เพิ่งกด พิมพ์ หรือเลื่อนหน้า
  const d=$('dialog'); if(d && d.hidden===false) return false;
  const ov=$('overlay'); if(ov && ov.hidden===false) return false;
  const ae=document.activeElement;
  if(ae && ae.closest && ae.closest('#app')){
    const tag=ae.tagName, ty=(ae.type||'').toLowerCase();
    if(tag==='TEXTAREA' || (tag==='INPUT' && ['checkbox','radio','button','submit'].indexOf(ty)<0)) return false;   // กำลังพิมพ์
  }
  if(state.me.role==='student' && state.st && !state.st.profile_done) return false;      // กำลังกรอกฟอร์ม
  return true;
}
async function pollOnce(){
  if(!pollOn || !state.me) return;
  if(document.hidden){ setLive('slow'); schedulePoll(3000); return; }
  try{
    const r=await gs('api_poll',{});
    pollFail=0; setLive(Date.now()-lastAct>IDLE_AFTER?'slow':'ok'); syncStamp();
    if(pollLast===null) pollLast=r.v;
    else if(r.v!==pollLast){ pollLast=r.v; state.stale=true; }
    if(state.stale && uiSafe()){ state.stale=false; try{ await refreshQuiet(); }catch(e){ console.error(e); state.stale=true; } }
  }catch(e){ pollFail++; if(pollFail>=2) setLive('off'); }
  schedulePoll(pollDelay());
}
document.addEventListener('visibilitychange',()=>{ if(!document.hidden && pollOn) schedulePoll(0); });
// จำตำแหน่งเลื่อนและข้อความที่พิมพ์ค้างไว้ แล้วคืนให้หลังวาดใหม่
function snapUI(){
  const o={y:window.scrollY||0, vals:{}, scroll:[]}, app=$('app');
  if(!app || !app.querySelectorAll) return o;
  app.querySelectorAll('input[id],textarea[id]').forEach(el=>{ o.vals[el.id]=el.value; });
  ['.tablewrap','.pick'].forEach(sel=>{ app.querySelectorAll(sel).forEach((el,i)=>{ o.scroll.push([sel,i,el.scrollTop,el.scrollLeft]); }); });
  return o;
}
function restoreUI(o){
  const app=$('app'); if(!app || !app.querySelectorAll) return;
  Object.keys(o.vals).forEach(id=>{ const el=document.getElementById(id); if(el && el.value!==o.vals[id]) el.value=o.vals[id]; });
  o.scroll.forEach(x=>{ const el=app.querySelectorAll(x[0])[x[1]]; if(el){ el.scrollTop=x[2]; el.scrollLeft=x[3]; } });
  if(window.scrollTo) window.scrollTo(0,o.y);
}
async function refreshQuiet(){
  const snap=snapUI();
  if(state.me.role==='teacher'){
    const pend=()=>state.T.requests.filter(x=>x.status==='pending').length;
    const before=state.T?pend():0;
    await loadTeacher();
    if(state.ttab==='report' && state.report && state.reportRoom){
      try{ state.report=await call('room_report',{p_room:state.reportRoom,p_subject:state.reportSubject}); }catch(e){}
    }
    if(!uiSafe()){ state.stale=true; return; }      // ระหว่างรอข้อมูล ผู้ใช้เริ่มพิมพ์หรือเปิดหน้าต่าง: ไว้วาดรอบหน้า
    if(state.ttab!=='gallery'){ renderTeacher(); restoreUI(snap); }
    if(pend()>before) toast('มีคำขอแลกรางวัลใหม่','info');
  } else {
    const old=state.st, reqBefore={}; state.requests.forEach(r=>{ reqBefore[r.id]=r.status; });
    await loadStudent();
    if(!state.st.profile_done) return;
    if(!uiSafe()){ state.stale=true; return; }
    renderStudent(); restoreUI(snap);
    if(old && state.st.points>old.points){ toast('ได้รับแต้มจิตอาสา +'+(state.st.points-old.points)+' 🌟'); setTimeout(()=>{ if(state.st && state.st.hatched && document.querySelector('.scene')) petReact(); },500); }
    state.requests.forEach(r=>{
      if(reqBefore[r.id]==='pending' && r.status==='approved') toast('ครูอนุมัติคำขอแลกรางวัลของคุณแล้ว');
      else if(reqBefore[r.id]==='pending' && r.status==='rejected') toast('คำขอแลกรางวัลไม่ผ่าน คืนแต้มให้แล้ว','warn');
    });
    if(!state.promptSkip && $('overlay').hidden!==false) autoPrompts();
  }
}

  if(busy) return; busy=true; scheduleBusy();

}
