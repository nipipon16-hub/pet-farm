  else if(a==='detaward'){ state.aw.sel={}; state.aw.sel[b.dataset.sid]=true; state.aw.q=''; state.aw.room=''; state.ttab='award'; renderTeacher(); }
  else if(a==='togglerr'){ run(async()=>{
    const on=!state.T.requireRoster;
    const ok=await askConfirm({icon:on?'🔒':'🔓',tone:'primary',
      title:on?'จำกัดเฉพาะคนในรายชื่อ?':'เปิดให้ทุกคนในโรงเรียนเข้าได้?',
      message:on?'จากนี้เฉพาะอีเมลที่อยู่ในรายชื่อนักเรียนเท่านั้นที่เข้าใช้ได้ คนที่ไม่อยู่ในรายชื่อจะเห็นหน้าแจ้งให้ติดต่อครู':'ทุกคนที่มีอีเมล @warin.ac.th และไม่ใช่ครู จะเข้าใช้ได้และถูกเพิ่มรายชื่ออัตโนมัติเมื่อเข้าครั้งแรก',
      confirmText:'ยืนยัน',cancelText:'ยกเลิก'});
    if(!ok) return;
    await call('set_require_roster',{p_value:on});
    await loadTeacher(); renderTeacher(); toast(on?'จำกัดเฉพาะคนในรายชื่อแล้ว':'เปิดให้ทุกคนในโรงเรียนเข้าได้แล้ว');
  }); }
  else if(a==='import'){ run(async()=>{
    const rows=$('roster-text').value.split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(l=>{
      const i=l.search(/[,\t]/); return i<0?{email:l,name:''}:{email:l.slice(0,i),name:l.slice(i+1)};
    });
    if(!rows.length){ toast('ยังไม่ได้วางรายชื่อ','warn'); return; }
    const n=await call('add_students',{p_rows:rows});
    await loadTeacher(); renderTeacher();
    const skipped=rows.length-n;
    await askConfirm({icon:skipped?'📋':'🎉',tone:'success',title:'นำเข้ารายชื่อเรียบร้อย',
      message:skipped?'บรรทัดที่ข้ามคืออีเมลที่ไม่ถูกต้อง หรือไม่ใช่ @warin.ac.th':'',
      rows:[['นำเข้า/อัปเดต',n+' รายชื่อ'],['ข้าม',skipped+' บรรทัด']],confirmText:'ตกลง',cancelText:null});
  }); }
});
document.addEventListener('dragstart',function(e){
  const r=e.target.closest && e.target.closest('.ordrow'); if(!r) return;
  state.ord.drag=r.dataset.sid;
  try{ e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain',r.dataset.sid); }catch(x){}
  r.classList.add('dragging');
});
document.addEventListener('dragover',function(e){
  const r=e.target.closest && e.target.closest('.ordrow'); if(!r || !state.ord.drag) return;
  e.preventDefault();
  document.querySelectorAll('.ordrow.over').forEach(x=>x.classList.remove('over')); r.classList.add('over');
});
document.addEventListener('drop',function(e){
  const r=e.target.closest && e.target.closest('.ordrow'); if(!r || !state.ord.drag) return;
  e.preventDefault();
  const from=state.ord.drag, to=state.ord.list.indexOf(r.dataset.sid); state.ord.drag='';
  ordMoveTo(from,to); renderOrdList();
});
document.addEventListener('dragend',function(){
  state.ord.drag=''; document.querySelectorAll('.ordrow.dragging,.ordrow.over').forEach(x=>x.classList.remove('dragging','over'));
});
document.addEventListener('keydown',function(e){
  const d=$('dialog'), open=d && d.hidden===false;
  if(open){
    if(e.key==='Escape'){ if(e.preventDefault) e.preventDefault(); closeDialog(false); return; }
    if(e.key==='Tab' && d.querySelectorAll){
      const f=[].slice.call(d.querySelectorAll('button')); if(!f.length) return;
      const i=f.indexOf(document.activeElement);
      if(e.shiftKey && i<=0){ f[f.length-1].focus(); e.preventDefault(); }
      else if(!e.shiftKey && (i===f.length-1 || i<0)){ f[0].focus(); e.preventDefault(); }
    }
    return;
  }
  const ov=$('overlay');
  if(e.key==='Escape' && ov && ov.hidden===false && ov.querySelector && ov.querySelector('[data-act="later"]')) closeOverlay();
});
document.addEventListener('input',function(e){
  const el=e.target; const a=el.dataset && el.dataset.act; if(!a) return;
  if(a==='bklabel'){ state.term.label=el.value; }
  else if(a==='termconfirm'){ state.term.confirm=el.value; const go=$('term-go'); if(go) go.disabled=!(el.value.trim()==='ยืนยัน' && termEffects().length>0 && (state.T.backups||[]).length<15); }
  else if(a==='bulktext'){ state.bulk.text=el.value; renderBulkPreview(); }
  else if(a==='awsearch'){ state.aw.q=el.value; renderAwList(); }
  else if(a==='awamt'){ state.aw.amt=el.value; updateAwCounters(); }
  else if(a==='awwhy'){ state.aw.why=el.value; }
  else if(a==='detsearch'){ state.det.q=el.value; renderDetailList(); }
});
document.addEventListener('change',function(e){
  const el=e.target; const a=el.dataset && el.dataset.act; if(!a) return;
  state.busyMsg=BUSY_MSG[a];
  const reloadT=async()=>{ await loadTeacher(); renderTeacher(); };
  if(a==='bulkaid'){ const id=Number(el.dataset.id), set=bulkSelectedAids(); const k=set.indexOf(id); if(el.checked&&k<0) set.push(id); if(!el.checked&&k>=0) set.splice(k,1); state.bulk.aids=set.length?set:[id]; renderTeacher(); }
  else if(a==='bulkroom'){ state.bulk.room=el.value; renderTeacher(); }
  else if(a==='termopt'){ state.term[el.dataset.k]=!!el.checked; if(el.dataset.k==='subjects'&&el.checked) state.term.scores=true; renderTeacher(); }
  else if(a==='motion'){ PREFS.motion=!!el.checked; savePrefs(); applyPrefs(); rerenderCurrent(); }
  else if(a==='ordroom'){ (async()=>{
    const O=state.ord, v=el.value;
    if(O.dirty){
      const ok=await askConfirm({icon:'!',tone:'danger',title:'ทิ้งการเปลี่ยนแปลงลำดับ?',message:'ลำดับของห้อง '+O.room+' ที่แก้ไว้ยังไม่ได้บันทึก',confirmText:'ทิ้งและเปลี่ยนห้อง',cancelText:'กลับไปบันทึก'});
      if(!ok){ renderTeacher(); return; }
    }
    if(v) ordLoad(v); else { O.room=''; O.list=[]; O.dirty=false; }
    renderTeacher();
  })(); }
  else if(a==='ordno'){ const n=parseInt(el.value,10); if(!isNaN(n)){ ordMoveTo(el.dataset.sid,n-1); } renderOrdList(); }
  else if(a==='awroom'){ state.aw.room=el.value; renderAwList(); }
  else if(a==='detroom'){ state.det.room=el.value; renderDetailList(); }
  else if(a==='awtoggle'){ state.aw.sel[el.dataset.sid]=!!el.checked; const row=el.closest&&el.closest('.pickrow'); if(row&&row.classList) row.classList.toggle('on',!!el.checked); updateAwCounters(); }
  else if(a==='filter'){ state.filter=el.value; renderTeacher(); }
  else if(a==='subjectsel'){ state.subjectSel=Number(el.value); state.bulk.aids=[]; renderTeacher(); }
  else if(a==='rproom'){ state.reportRoom=el.value; }
  else if(a==='rpsub'){ state.reportSubject=Number(el.value); }
  else if(a==='subname'){ run(async()=>{ try{ await call('rename_subject',{p_id:Number(el.dataset.id),p_name:el.value}); await reloadT(); toast('เปลี่ยนชื่อวิชาแล้ว'); }catch(err){ await reloadT(); throw err; } }); }
  else if(a==='asgname'){ run(async()=>{ try{ await call('update_assignment',{p_id:Number(el.dataset.id),p_name:el.value}); await reloadT(); toast('แก้ชื่องานแล้ว'); }catch(err){ await reloadT(); throw err; } }); }
  else if(a==='asgmax'){ run(async()=>{ try{ await call('update_assignment',{p_id:Number(el.dataset.id),p_max:Number(el.value)}); await reloadT(); toast('แก้คะแนนเต็มแล้ว'); }catch(err){ await reloadT(); throw err; } }); }
  else if(a==='rename'){ if(state.st && state.st.species==='jay'){ renderStudent(); } else run(async()=>{ state.st=await call('rename_pet',{p_name:el.value}); renderStudent(); toast('เปลี่ยนชื่อสัตว์เลี้ยงแล้ว'); }); }
  else if(a==='score'){ run(async()=>{
    const email=el.dataset.sid, aid=Number(el.dataset.aid), idx=el.dataset.idx;
    const val = el.value==='' ? null : Number(el.value);
    try{
      const res = await call('set_score',{p_email:email,p_assignment:aid,p_score:val});
      const T=state.T; T.sc[email]=T.sc[email]||{};
      if(res===null||res===undefined){ delete T.sc[email][aid]; el.value=''; }
      else { T.sc[email][aid]=Number(res); el.value=res; }
      const t=tTotal(email); const c=$('tot-'+idx); if(c) c.innerHTML=t+' <small>'+STAGES[stageOf(t)].name+'</small>';
      const c2=$('sub-'+idx); if(c2) c2.textContent=subjectTotal(Number(el.dataset.sub),state.T.assignments,state.T.sc[email]||{});
      if(el.dataset.ctx==='detail') updateDetailTotals(email,Number(el.dataset.sub));
    }catch(err){ await loadTeacher(); renderTeacher(); throw err; }
  }); }
  else if(a==='max'){ run(async()=>{
    await call('set_assignment_max',{p_id:Number(el.dataset.aid),p_max:Number(el.value)});
    await loadTeacher(); renderTeacher();
  }); }
});

applySite(); applyPrefs(); scheduleBalloon(7000);
boot();

</script>
</body>
</html>
